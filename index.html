<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gagan Kesireddy | AI & Robotics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030508; /* Deep space dark */
            font-family: 'Inter', sans-serif;
        }

        /* 3D Canvas Layer */
        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: grab;
        }
        #webgl-container:active {
            cursor: grabbing;
        }

        /* Minimalist UI Overlay (Like Deekshitth's) */
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none; /* Lets mouse clicks pass through to the 3D scene */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2.5rem 4rem;
            box-sizing: border-box;
            color: #ffffff;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-weight: 600;
            letter-spacing: 2px;
            font-size: 1rem;
            text-transform: uppercase;
        }
        .nav {
            display: flex;
            gap: 3rem;
        }
        .nav-item {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 300;
            cursor: pointer;
            pointer-events: auto;
            transition: opacity 0.3s;
        }
        .nav-item:hover {
            opacity: 0.6;
        }

        /* Center Content */
        .center-content {
            text-align: center;
            pointer-events: auto;
        }
        .center-content h1 {
            font-size: 6rem;
            font-weight: 200;
            margin: 0;
            letter-spacing: -3px;
        }
        .center-content h2 {
            font-size: 1.2rem;
            font-weight: 300;
            color: #a0aec0;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        .btn-expedition {
            margin-top: 40px;
            padding: 15px 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            border-radius: 50px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.4s ease;
            backdrop-filter: blur(5px);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Inter', sans-serif;
        }
        .btn-expedition:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
            transform: scale(1.05);
        }

        .drag-hint {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 20px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* Bottom Bar */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        @media (max-width: 768px) {
            .center-content h1 { font-size: 3.5rem; }
            .ui-overlay { padding: 1.5rem; }
            .nav { display: none; }
        }
    </style>
</head>
<body>

    <!-- 3D Canvas -->
    <div id="webgl-container"></div>
    
    <!-- Floating Minimalist UI -->
    <div class="ui-overlay">
        <div class="header">
            <div class="logo">Gagan Kesireddy</div>
            <div class="nav">
                <div class="nav-item">Trajectory</div>
                <div class="nav-item">Kinematics</div>
                <div class="nav-item">Neural Core</div>
            </div>
        </div>
        
        <div class="center-content">
            <h1>Deekshitth</h1> <!-- Wait, updating to your name! -->
            <h1 style="font-size: 5rem;">Gagan Kesireddy</h1>
            <h2>Robotics M.Sc. & AI Engineer</h2>
            
            <a href="Resume_Gagan_Kesireddy.pdf" target="_blank" style="text-decoration: none;">
                <button class="btn-expedition">Initialize Profile</button>
            </a>
            
            <div class="drag-hint">Drag to explore the environment</div>
        </div>
        
        <div class="bottom-bar">
            <div>Cham, Bavaria</div>
            <div>ROS 2 Node: Active</div>
        </div>
    </div>

    <!-- Three.js Library & Controls (Required for 3D) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        // 1. Scene Setup
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030508, 0.0015); // Adds depth/fade to the edges

        // 2. Camera Setup
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.z = 400;

        // 3. Renderer Setup
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // 4. Mouse Controls (Allows you to drag and look around)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = true;
        controls.autoRotate = true; // Slowly spins the world automatically
        controls.autoRotateSpeed = 0.8;

        // 5. Build the 3D Particle Cloud
        const particlesCount = 8000;
        const posArray = new Float32Array(particlesCount * 3);
        const colorsArray = new Float32Array(particlesCount * 3);

        const colorBlue = new THREE.Color(0x0088ff); 
        const colorCyan = new THREE.Color(0x00f0ff);
        const colorWhite = new THREE.Color(0xffffff);

        for(let i = 0; i < particlesCount * 3; i+=3) {
            // Distribute particles in a massive 3D sphere
            const radius = 800 * Math.random();
            const theta = 2 * Math.PI * Math.random();
            const phi = Math.acos(2 * Math.random() - 1);

            posArray[i] = radius * Math.sin(phi) * Math.cos(theta);
            posArray[i+1] = radius * Math.sin(phi) * Math.sin(theta);
            posArray[i+2] = radius * Math.cos(phi);

            // Mix the colors dynamically
            const randColor = Math.random();
            let c = colorBlue;
            if (randColor > 0.7) c = colorCyan;
            if (randColor > 0.95) c = colorWhite;

            colorsArray[i] = c.r;
            colorsArray[i+1] = c.g;
            colorsArray[i+2] = c.b;
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colorsArray, 3));

        const material = new THREE.PointsMaterial({
            size: 2.5,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.8
        });

        const particlesMesh = new THREE.Points(geometry, material);
        scene.add(particlesMesh);

        // 6. Build the Inner 3D Geometric Core
        const coreGeo = new THREE.IcosahedronGeometry(80, 2);
        const coreMat = new THREE.MeshBasicMaterial({ 
            color: 0x0088ff, 
            wireframe: true, 
            transparent: true, 
            opacity: 0.15 
        });
        const core = new THREE.Mesh(coreGeo, coreMat);
        scene.add(core);

        const innerCoreGeo = new THREE.IcosahedronGeometry(50, 1);
        const innerCoreMat = new THREE.MeshBasicMaterial({ 
            color: 0x00f0ff, 
            wireframe: true, 
            transparent: true, 
            opacity: 0.3 
        });
        const innerCore = new THREE.Mesh(innerCoreGeo, innerCoreMat);
        scene.add(innerCore);

        // 7. Animation Loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Gently rotate the inner geometric shapes
            core.rotation.x = elapsedTime * 0.1;
            core.rotation.y = elapsedTime * 0.15;
            innerCore.rotation.x = elapsedTime * -0.2;
            innerCore.rotation.y = elapsedTime * -0.1;

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 8. Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
