<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gagan Kesireddy | Robotics & AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-deep: #02040a;
            /* Change this hex code to change the main website color! */
            --theme-color: #0088ff; 
            --theme-glow: rgba(0, 136, 255, 0.4);
            
            --red-chip: #ff003c;
            --silver: #cbd5e1;
            --font-tech: 'Rajdhani', sans-serif;
            --font-mono: 'Fira Code', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 80% 50%, rgba(0, 136, 255, 0.05) 0%, transparent 40%),
                linear-gradient(rgba(0, 136, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 136, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            color: var(--silver);
            font-family: var(--font-tech);
            overflow-x: hidden;
            transition: all 0.5s ease;
        }

        /* Red Chip Mode Class */
        body.red-chip-mode {
            --theme-color: var(--red-chip);
            --theme-glow: rgba(255, 0, 60, 0.4);
            background-image: 
                radial-gradient(circle at 80% 50%, rgba(255, 0, 60, 0.08) 0%, transparent 40%),
                linear-gradient(rgba(255, 0, 60, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 60, 0.03) 1px, transparent 1px);
        }

        #lidar-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            border-bottom: 1px solid rgba(0, 136, 255, 0.1);
            background: rgba(2, 4, 10, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: border-color 0.5s ease;
        }
        body.red-chip-mode nav { border-bottom-color: rgba(255, 0, 60, 0.2); }

        .logo {
            font-family: var(--font-mono);
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--theme-color);
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--theme-glow);
        }

        .hero {
            min-height: 85vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            padding: 2rem 5%;
            gap: 4rem;
        }

        .hero-content {
            padding: 2rem;
            position: relative;
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            line-height: 1.1;
        }

        .hero h2 {
            font-size: 1.5rem;
            color: var(--silver);
            margin-bottom: 2rem;
            border-left: 4px solid var(--theme-color);
            padding-left: 1rem;
            letter-spacing: 1px;
        }

        .tech-modules {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 3rem;
        }

        .tech-tag {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--theme-color);
            background: rgba(0, 136, 255, 0.05);
            border: 1px solid var(--theme-color);
            padding: 0.5rem 1rem;
            border-radius: 2px;
            box-shadow: inset 0 0 10px var(--theme-glow);
            text-transform: uppercase;
        }

        .hero-buttons {
            display: flex;
            gap: 1.5rem;
        }

        .btn {
            padding: 1rem 2rem;
            font-family: var(--font-mono);
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            transition: all 0.3s ease;
            cursor: pointer;
            border-radius: 4px;
        }

        .btn-primary {
            background: var(--theme-color);
            color: var(--bg-deep);
            box-shadow: 0 0 20px var(--theme-glow);
            border: 2px solid var(--theme-color);
        }

        .btn-primary:hover {
            box-shadow: 0 0 30px var(--theme-glow);
            transform: scale(1.05);
        }

        .btn-red-chip {
            background: transparent;
            color: var(--silver);
            border: 2px solid var(--silver);
        }

        .btn-red-chip:hover {
            background: var(--red-chip);
            color: #fff;
            border-color: var(--red-chip);
            box-shadow: 0 0 30px rgba(255, 0, 60, 0.6);
        }

        /* Chitti Neural Core Animation */
        .neural-core-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 400px;
        }

        .core-ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--theme-color);
            border-bottom-color: var(--theme-color);
            box-shadow: 0 0 20px var(--theme-glow), inset 0 0 20px var(--theme-glow);
        }

        .ring-1 { width: 300px; height: 300px; animation: spin 8s linear infinite; }
        .ring-2 { width: 240px; height: 240px; border-left-color: var(--theme-color); border-right-color: var(--theme-color); border-top-color: transparent; border-bottom-color: transparent; animation: spin-reverse 5s linear infinite; }
        .ring-3 { width: 180px; height: 180px; border-style: dashed; animation: spin 12s linear infinite; }

        .terminal-hud {
            position: absolute;
            width: 80%;
            background: rgba(2, 4, 10, 0.8);
            border: 1px solid var(--theme-color);
            padding: 1.5rem;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--theme-color);
            backdrop-filter: blur(5px);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }

    </style>
</head>
<body>

    <canvas id="lidar-canvas"></canvas>

    <nav>
        <div class="logo">&lt;KGC.LAB /&gt;</div>
        <div>
            <span style="font-family: 'Fira Code'; font-size: 0.8rem; color: var(--theme-color);">[ SYSTEM ONLINE ]</span>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <h1>Gagan Kesireddy</h1>
            <h2>Robotics M.Sc. & AI Engineer bridging neural networks with real-world kinematics.</h2>
            
            <div class="tech-modules">
                <div class="tech-tag">ROS 2 / HUMBLE</div>
                <div class="tech-tag">NEURAL NETWORKS (TD3)</div>
                <div class="tech-tag">6-DoF MANIPULATION</div>
            </div>
            
            <div class="hero-buttons">
                <a href="Resume_Gagan_Kesireddy.pdf" target="_blank" class="btn btn-primary"><i class="fas fa-file-pdf"></i> Initialize Resume</a>
                <button class="btn btn-red-chip" id="red-chip-btn"><i class="fas fa-microchip"></i> Install Red Chip</button>
            </div>
        </div>

        <div class="neural-core-container">
            <div class="core-ring ring-1"></div>
            <div class="core-ring ring-2"></div>
            <div class="core-ring ring-3"></div>
            
            <div class="terminal-hud">
                <div id="typewriter"></div>
            </div>
        </div>
    </section>

    <script>
        const redChipBtn = document.getElementById('red-chip-btn');
        const body = document.body;
        
        redChipBtn.addEventListener('mouseenter', () => {
            body.classList.add('red-chip-mode');
            redChipBtn.innerHTML = '<i class="fas fa-biohazard"></i> DESTRUCTIVE MODE';
        });
        
        redChipBtn.addEventListener('mouseleave', () => {
            body.classList.remove('red-chip-mode');
            redChipBtn.innerHTML = '<i class="fas fa-microchip"></i> Install Red Chip';
        });

        const lines = [
            "> INITIALIZING NEURAL SCHEMA...",
            "> LOADING KINEMATIC MODEL (UR5e)...",
            "> CHECKING SPECS...",
            "> SPEED: 1 TERAHERTZ.",
            "> MEMORY: 1 ZETTABYTE.",
            "> ROS_CORE READY. █"
        ];
        
        let lineIndex = 0; let charIndex = 0;
        const terminal = document.getElementById("typewriter");

        function typeWriter() {
            if (lineIndex < lines.length) {
                if (charIndex < lines[lineIndex].length) {
                    terminal.innerHTML += lines[lineIndex].charAt(charIndex);
                    charIndex++;
                    setTimeout(typeWriter, 30);
                } else {
                    terminal.innerHTML += "<br/>";
                    lineIndex++;
                    charIndex = 0;
                    setTimeout(typeWriter, 500);
                }
            }
        }
        setTimeout(typeWriter, 800);

        const canvas = document.getElementById('lidar-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        let mouse = { x: null, y: null };
        window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; });
        window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });

        const particles = [];
        for (let i = 0; i < 100; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                dx: (Math.random() - 0.5) * 0.8,
                dy: (Math.random() - 0.5) * 0.8,
                radius: 1.5
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const isRed = body.classList.contains('red-chip-mode');
            // Hardcoded to match CSS variables for performance
            const particleColor = isRed ? '#ff003c' : '#0088ff'; 
            
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += p.dx; p.y += p.dy;
                
                if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
                
                ctx.fillStyle = particleColor;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();

                for (let j = i; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 120) {
                        ctx.strokeStyle = isRed ? `rgba(255, 0, 60, ${0.2 - dist/600})` : `rgba(0, 136, 255, ${0.2 - dist/600})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            }
        }
        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
