<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gagan Kesireddy | Robotics Navigator</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-carbon: #06080C;
            --panel-bg: #0A0D14;
            --petronas-cyan: #00A19B;
            --raze-red: #FF4655;
            --silver: #E2E8F0;
            --text-muted: #8B978F;
            --font-head: 'Rajdhani', sans-serif;
            --font-tech: 'Fira Code', monospace;
            --font-body: 'Inter', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%; height: 100%;
            background-color: var(--bg-carbon);
            color: var(--silver);
            overflow: hidden;
            display: flex;
        }

        /* LEFT PANEL */
        .left-panel {
            width: 40%;
            min-width: 450px; max-width: 550px;
            height: 100%;
            background-color: var(--panel-bg);
            border-right: 2px solid rgba(255, 70, 85, 0.2);
            padding: 3rem;
            display: flex; flex-direction: column;
            position: relative; z-index: 10;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        
        .logo {
            font-family: var(--font-tech); font-size: 1.8rem; font-weight: 700;
            color: var(--raze-red); text-shadow: 0 0 10px rgba(255, 70, 85, 0.4);
            cursor: pointer;
        }

        /* Dynamic Content Container */
        #dynamic-content { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }

        .availability {
            font-family: var(--font-tech); color: #39ff14; font-size: 0.8rem;
            display: inline-flex; align-items: center; gap: 8px; margin-bottom: 1.5rem;
            padding: 0.4rem 0.8rem; background: rgba(57, 255, 20, 0.05);
            border: 1px solid rgba(57, 255, 20, 0.3); border-radius: 2px; align-self: flex-start;
        }

        .pulse-dot { width: 6px; height: 6px; border-radius: 50%; background: #39ff14; box-shadow: 0 0 8px #39ff14; animation: pulse 1.5s infinite; }

        h1 { font-family: var(--font-head); font-size: 3.5rem; font-weight: 700; line-height: 1; margin-bottom: 1rem; text-transform: uppercase; }
        h2 { font-family: var(--font-body); font-size: 1.1rem; font-weight: 300; color: var(--text-muted); margin-bottom: 2rem; line-height: 1.5; }

        .stats-strip {
            font-family: var(--font-tech); font-size: 0.85rem; color: var(--raze-red);
            background: rgba(255, 70, 85, 0.05); padding: 1rem; border-left: 3px solid var(--raze-red);
            margin-bottom: 3rem; line-height: 1.8; word-spacing: 3px;
        }

        /* Project Specific Styles */
        .project-title { color: var(--petronas-cyan); font-size: 2.5rem; }
        .project-tech { font-family: var(--font-tech); font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem; }
        .project-desc { font-family: var(--font-body); font-size: 1rem; color: var(--silver); line-height: 1.6; margin-bottom: 1.5rem; }
        .project-list { font-family: var(--font-body); font-size: 0.95rem; color: var(--silver); margin-left: 1.5rem; line-height: 1.8; }
        .project-list li { margin-bottom: 0.5rem; }

        .button-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .btn {
            display: flex; align-items: center; justify-content: center; gap: 10px; padding: 1rem;
            font-family: var(--font-tech); font-size: 0.85rem; font-weight: 600; text-transform: uppercase;
            text-decoration: none; transition: all 0.2s ease; border-radius: 2px; cursor: pointer;
        }
        .btn-primary { background: var(--petronas-cyan); color: #fff; border: 1px solid var(--petronas-cyan); grid-column: span 2; }
        .btn-primary:hover { background: #fff; color: var(--bg-carbon); }
        .btn-secondary { background: transparent; color: var(--silver); border: 1px solid var(--text-muted); }
        .btn-secondary:hover { border-color: var(--raze-red); color: var(--raze-red); background: rgba(255, 70, 85, 0.05); }

        /* RIGHT PANEL */
        .right-panel { flex-grow: 1; position: relative; background-color: var(--bg-carbon); overflow: hidden; }
        #webgl-container { width: 100%; height: 100%; cursor: crosshair; outline: none; }

        .hud-overlay { position: absolute; top: 2rem; right: 2rem; font-family: var(--font-tech); font-size: 0.75rem; color: var(--text-muted); text-align: right; pointer-events: none; z-index: 5; }
        .hud-overlay span { color: var(--raze-red); }

        #titan-btn {
            position: absolute; bottom: 3rem; left: 50%; transform: translateX(-50%);
            background: rgba(255, 70, 85, 0.1); border: 1px solid var(--raze-red); color: var(--raze-red);
            padding: 1rem 2rem; font-family: var(--font-tech); font-size: 1rem; font-weight: 700;
            cursor: pointer; text-transform: uppercase; box-shadow: 0 0 15px rgba(255, 70, 85, 0.3);
            transition: all 0.3s ease; z-index: 5;
        }
        #titan-btn:hover { background: var(--raze-red); color: #fff; }
        #titan-btn.active { background: var(--petronas-cyan); border-color: var(--petronas-cyan); color: #fff; box-shadow: 0 0 20px rgba(0, 161, 155, 0.5); }

        .hint-text {
            position: absolute; bottom: 1rem; left: 50%; transform: translateX(-50%);
            font-family: var(--font-tech); font-size: 0.85rem; color: #fff;
            pointer-events: none; text-transform: uppercase; letter-spacing: 2px;
            display: none; z-index: 5; text-shadow: 0 0 10px #000;
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <!-- LEFT PANEL: Dynamic UI -->
    <div class="left-panel" id="left-panel">
        <div class="panel-header">
            <div class="logo" onclick="loadContent('hero')">&lt;KGC.LAB/&gt;</div>
            <div style="font-family: var(--font-tech); font-size: 0.75rem; color: var(--text-muted);">SYS.NAV</div>
        </div>
        
        <div id="dynamic-content">
            <!-- Content is injected here by JS -->
        </div>
    </div>

    <!-- RIGHT PANEL: 3D Swarm Navigation -->
    <div class="right-panel" id="right-panel">
        <div class="hud-overlay">
            SYS: <span>CHITTI.NEURAL</span><br>
            SWARM PROTOCOL: <span id="mode-text">SCATTERED</span><br>
            LOCATION: <span id="loc-text">HOME</span>
        </div>
        
        <button id="titan-btn">ACTIVATE TITAN</button>
        <div class="hint-text" id="wasd-hint">[ USE W A S D TO WALK INTO PROJECT PORTALS ]</div>
        
        <div id="webgl-container" tabindex="0"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        /* ==================================================
           1. DYNAMIC CONTENT INJECTION (LEFT PANEL)
        ================================================== */
        const contentData = {
            hero: `
                <div class="availability"><div class="pulse-dot"></div>Open to internships from March 2027</div>
                <h1>Gagan Chaitanya<br>Kesireddy</h1>
                <h2>Robotics M.Sc. student bridging deep learning and real robot manipulation.</h2>
                <div class="stats-strip">UR5e &middot; ROS 2 &middot; MoveIt &middot; YOLO<br>SLAM &middot; 1 Publication (DRDO)</div>
                <div class="button-grid">
                    <a href="Resume_Gagan_Kesireddy.pdf" target="_blank" class="btn btn-primary"><i class="fas fa-file-pdf"></i> Initialize Resume</a>
                    <a href="https://github.com/Gagan-2211" target="_blank" class="btn btn-secondary"><i class="fab fa-github"></i> GitHub</a>
                    <a href="#" class="btn btn-secondary"><i class="fab fa-linkedin"></i> LinkedIn</a>
                </div>
            `,
            ur5e: `
                <div class="availability" style="color:var(--petronas-cyan); border-color:var(--petronas-cyan); background:rgba(0,161,155,0.1);">
                    PROJECT 01 DEPLOYED
                </div>
                <h1 class="project-title">6-DoF UR5e<br>Manipulator</h1>
                <div class="project-tech">Gazebo | MoveIt | TF2 | IK Solvers</div>
                <p class="project-desc">Achieved 100% success rate in autonomous peg-in-hole assembly, color sorting, and pendulum stabilization.</p>
                <ul class="project-list">
                    <li>Engineered custom Inverse Kinematics (IK) solver.</li>
                    <li>Mapped full TF2 frame tree for exact spatial calibration.</li>
                    <li>Resolved delayed target calibration to hit flawless execution metrics.</li>
                </ul>
            `,
            slam: `
                <div class="availability" style="color:#FFD700; border-color:#FFD700; background:rgba(255,215,0,0.1);">
                    PROJECT 02 DEPLOYED
                </div>
                <h1 class="project-title" style="color:#FFD700;">CV, SLAM &<br>Navigation</h1>
                <div class="project-tech">ROS 2 | YOLO | OpenCV | Nav2</div>
                <p class="project-desc">Integrated real-time perception with autonomous mapping protocols.</p>
                <ul class="project-list">
                    <li>Deployed YOLO for dynamic bounding box detection.</li>
                    <li>Built real-time map generation running at peak Hz rates.</li>
                    <li>Synchronized raw camera feeds with LIDAR point clouds.</li>
                </ul>
            `,
            motion: `
                <div class="availability" style="color:#FF4655; border-color:#FF4655; background:rgba(255,70,85,0.1);">
                    PROJECT 03 DEPLOYED
                </div>
                <h1 class="project-title" style="color:#FF4655;">Motion<br>Prediction</h1>
                <div class="project-tech">LSTM | 1D-CNN | inD Dataset | Python</div>
                <p class="project-desc">Deep learning model for anticipating traffic participant trajectories.</p>
                <ul class="project-list">
                    <li>Engineered hybrid LSTM and 1D-CNN architecture.</li>
                    <li>Minimized ADE (Average Displacement Error) and FDE metrics.</li>
                    <li>Generated fan-out trajectory visualizations.</li>
                </ul>
            `
        };

        const dynamicContainer = document.getElementById('dynamic-content');
        const locText = document.getElementById('loc-text');
        let currentProject = 'hero';

        function loadContent(id) {
            if (currentProject === id) return;
            currentProject = id;
            dynamicContainer.style.opacity = 0;
            setTimeout(() => {
                dynamicContainer.innerHTML = contentData[id];
                dynamicContainer.style.opacity = 1;
                locText.innerText = id.toUpperCase();
                
                // Change border color to match project
                let borderColor = 'rgba(255, 70, 85, 0.2)'; // Default red
                if (id === 'ur5e') borderColor = 'rgba(0, 161, 155, 0.4)'; // Cyan
                if (id === 'slam') borderColor = 'rgba(255, 215, 0, 0.4)'; // Yellow
                document.getElementById('left-panel').style.borderRightColor = borderColor;
            }, 300);
        }
        
        // Initial Load
        dynamicContainer.innerHTML = contentData['hero'];

        /* ==================================================
           2. THREE.JS SWARM & TITAN ENGINE
        ================================================== */
        const container = document.getElementById('webgl-container');
        const rightPanel = document.getElementById('right-panel');
        const titanBtn = document.getElementById('titan-btn');
        const modeText = document.getElementById('mode-text');
        const wasdHint = document.getElementById('wasd-hint');
        
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x06080C, 0.0008);
        const camera = new THREE.PerspectiveCamera(60, rightPanel.clientWidth / rightPanel.clientHeight, 0.1, 3000);
        camera.position.set(0, 300, 1000);
        camera.lookAt(0, -100, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(rightPanel.clientWidth, rightPanel.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Grid helper for the floor
        const gridHelper = new THREE.GridHelper(2000, 40, 0x333333, 0x111111);
        gridHelper.position.y = -200;
        scene.add(gridHelper);

        // PROJECT PORTALS (Nodes on the ground)
        const portals = [
            { id: 'ur5e', color: 0x00A19B, x: -400, z: -200 },
            { id: 'slam', color: 0xFFD700, x: 0, z: -400 },
            { id: 'motion', color: 0xFF4655, x: 400, z: -200 }
        ];

        portals.forEach(p => {
            const ringGeo = new THREE.RingGeometry(60, 80, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: p.color, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = -Math.PI / 2;
            ring.position.set(p.x, -199, p.z);
            scene.add(ring);
            
            // Floating Label (Simple Cube for now)
            const boxGeo = new THREE.BoxGeometry(20, 20, 20);
            const boxMat = new THREE.MeshBasicMaterial({ color: p.color, wireframe: true });
            const box = new THREE.Mesh(boxGeo, boxMat);
            box.position.set(p.x, -150, p.z);
            scene.add(box);
            p.mesh = box; // Store for animation
        });

        // Particle System
        const particlesCount = 5000;
        const geometry = new THREE.BufferGeometry();
        
        const currentPos = new Float32Array(particlesCount * 3);
        const titanPos = new Float32Array(particlesCount * 3);
        const swarmVel = new Float32Array(particlesCount * 3);
        const colors = new Float32Array(particlesCount * 3);

        const colorRed = new THREE.Color(0xFF4655);
        const colorCyan = new THREE.Color(0x00A19B);

        for(let i = 0; i < particlesCount; i++) {
            let idx = i * 3;
            
            // Random Initial Swarm
            currentPos[idx] = (Math.random() - 0.5) * 2000;
            currentPos[idx+1] = (Math.random() - 0.5) * 1500;
            currentPos[idx+2] = (Math.random() - 0.5) * 2000;

            swarmVel[idx] = (Math.random() - 0.5) * 4;
            swarmVel[idx+1] = (Math.random() - 0.5) * 4;
            swarmVel[idx+2] = (Math.random() - 0.5) * 4;

            colors[idx] = colorRed.r; colors[idx+1] = colorRed.g; colors[idx+2] = colorRed.b;

            // Titan Humanoid Matrix
            let part = Math.random();
            let tx, ty, tz;
            if (part < 0.1) { // Head
                tx = (Math.random() - 0.5) * 60; ty = 180 + Math.random() * 60; tz = (Math.random() - 0.5) * 60;
            } else if (part < 0.45) { // Torso
                tx = (Math.random() - 0.5) * 140; ty = 20 + Math.random() * 160; tz = (Math.random() - 0.5) * 80;
            } else if (part < 0.6) { // Left Arm
                tx = -110 - Math.random() * 40; ty = 20 + Math.random() * 140; tz = (Math.random() - 0.5) * 40;
            } else if (part < 0.75) { // Right Arm
                tx = 110 + Math.random() * 40; ty = 20 + Math.random() * 140; tz = (Math.random() - 0.5) * 40;
            } else if (part < 0.875) { // Left Leg
                tx = -40 + (Math.random() - 0.5) * 50; ty = -180 + Math.random() * 200; tz = (Math.random() - 0.5) * 50;
            } else { // Right Leg
                tx = 40 + (Math.random() - 0.5) * 50; ty = -180 + Math.random() * 200; tz = (Math.random() - 0.5) * 50;
            }
            titanPos[idx] = tx; titanPos[idx+1] = ty; titanPos[idx+2] = tz;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(currentPos, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({ size: 3.5, vertexColors: true, blending: THREE.AdditiveBlending, transparent: true, opacity: 0.9 });
        const particlesMesh = new THREE.Points(geometry, material);
        scene.add(particlesMesh);

        // State and Controls
        let isTitan = false;
        let titanOffset = { x: 0, z: 0 };
        const keys = { w: false, a: false, s: false, d: false };

        titanBtn.addEventListener('click', () => {
            isTitan = !isTitan;
            container.focus(); // Focus canvas for WASD
            if(isTitan) {
                titanBtn.innerText = "SCATTER SWARM";
                titanBtn.classList.add('active');
                modeText.innerText = "TITAN ASSEMBLED";
                modeText.style.color = "#00A19B";
                wasdHint.style.display = "block";
            } else {
                titanBtn.innerText = "ACTIVATE TITAN";
                titanBtn.classList.remove('active');
                modeText.innerText = "SCATTERED";
                modeText.style.color = "#FF4655";
                wasdHint.style.display = "none";
                loadContent('hero'); // Reset UI
                for(let i=0; i<particlesCount*3; i+=3) {
                    swarmVel[i] = (Math.random() - 0.5) * 25;
                    swarmVel[i+1] = (Math.random() - 0.5) * 25;
                    swarmVel[i+2] = (Math.random() - 0.5) * 25;
                }
            }
        });

        // WASD Listeners
        container.addEventListener('keydown', (e) => { const key = e.key.toLowerCase(); if(keys.hasOwnProperty(key)) keys[key] = true; });
        container.addEventListener('keyup', (e) => { const key = e.key.toLowerCase(); if(keys.hasOwnProperty(key)) keys[key] = false; });

        function animate() {
            requestAnimationFrame(animate);
            const positions = geometry.attributes.position.array;
            const cols = geometry.attributes.color.array;

            // Animate Portals
            portals.forEach(p => { p.mesh.rotation.x += 0.02; p.mesh.rotation.y += 0.02; });

            if (isTitan) {
                // WASD Logic
                let speed = 10.0;
                if (keys.w) titanOffset.z -= speed;
                if (keys.s) titanOffset.z += speed;
                if (keys.a) titanOffset.x -= speed;
                if (keys.d) titanOffset.x += speed;

                // Portal Collision Detection
                portals.forEach(p => {
                    let dist = Math.hypot(titanOffset.x - p.x, titanOffset.z - p.z);
                    if (dist < 80) loadContent(p.id);
                });

                for(let i = 0; i < particlesCount; i++) {
                    let idx = i * 3;
                    // Snap to Titan
                    positions[idx] += (titanPos[idx] + titanOffset.x - positions[idx]) * 0.1;
                    positions[idx+1] += (titanPos[idx+1] - positions[idx+1]) * 0.1;
                    positions[idx+2] += (titanPos[idx+2] + titanOffset.z - positions[idx+2]) * 0.1;
                    // Shift to Cyan
                    cols[idx] += (colorCyan.r - cols[idx]) * 0.1; cols[idx+1] += (colorCyan.g - cols[idx+1]) * 0.1; cols[idx+2] += (colorCyan.b - cols[idx+2]) * 0.1;
                }
            } else {
                for(let i = 0; i < particlesCount; i++) {
                    let idx = i * 3;
                    // Roam
                    positions[idx] += swarmVel[idx]; positions[idx+1] += swarmVel[idx+1]; positions[idx+2] += swarmVel[idx+2];
                    if (positions[idx] > 1000 || positions[idx] < -1000) swarmVel[idx] *= -1;
                    if (positions[idx+1] > 800 || positions[idx+1] < -200) swarmVel[idx+1] *= -1; // Keep above floor
                    if (positions[idx+2] > 1000 || positions[idx+2] < -1000) swarmVel[idx+2] *= -1;
                    
                    swarmVel[idx] = swarmVel[idx] * 0.98 + (Math.random() - 0.5) * 0.3;
                    swarmVel[idx+1] = swarmVel[idx+1] * 0.98 + (Math.random() - 0.5) * 0.3;
                    swarmVel[idx+2] = swarmVel[idx+2] * 0.98 + (Math.random() - 0.5) * 0.3;

                    cols[idx] += (colorRed.r - cols[idx]) * 0.1; cols[idx+1] += (colorRed.g - cols[idx+1]) * 0.1; cols[idx+2] += (colorRed.b - cols[idx+2]) * 0.1;
                }
            }

            geometry.attributes.position.needsUpdate = true;
            geometry.attributes.color.needsUpdate = true;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = rightPanel.clientWidth / rightPanel.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(rightPanel.clientWidth, rightPanel.clientHeight);
        });
    </script>
</body>
</html>
