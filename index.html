<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gagan Kesireddy | AI & Robotics</title>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0F1923; /* Valorant Dark UI Background */
            font-family: 'Inter', sans-serif;
            color: #ECE8E1; /* Valorant Off-White */
        }

        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: crosshair;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2.5rem 4rem;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-family: 'Teko', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #FF4655; /* Valorant Red */
            text-transform: uppercase;
            line-height: 1;
        }

        .nav {
            display: flex;
            gap: 3rem;
        }
        
        .nav-item {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            cursor: pointer;
            pointer-events: auto;
            transition: color 0.3s;
        }
        
        .nav-item:hover {
            color: #FF4655;
        }

        .center-content {
            text-align: center;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .center-content h1 {
            font-family: 'Teko', sans-serif;
            font-size: 7rem;
            font-weight: 700;
            margin: 0;
            line-height: 0.9;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 70, 85, 0.2);
        }
        
        .center-content h2 {
            font-size: 1.1rem;
            font-weight: 400;
            color: #8B978F;
            margin-top: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .btn-expedition {
            margin-top: 40px;
            padding: 15px 45px;
            background: #FF4655;
            border: none;
            color: #ECE8E1;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 3px;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            pointer-events: auto;
        }
        
        .btn-expedition:hover {
            background: #ECE8E1;
            color: #0F1923;
            transform: scale(1.05);
        }

        .drag-hint {
            font-size: 0.8rem;
            color: #FF4655;
            margin-top: 25px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: pulse 2s infinite;
        }

        .bottom-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #8B978F;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        @media (max-width: 768px) {
            .center-content h1 { font-size: 4rem; }
            .ui-overlay { padding: 1.5rem; }
            .nav { display: none; }
        }
    </style>
</head>
<body>

    <div id="webgl-container"></div>
    
    <div class="ui-overlay">
        <div class="header">
            <div class="logo">KGC.LAB</div>
            <div class="nav">
                <div class="nav-item">Payloads</div>
                <div class="nav-item">Kinematics</div>
                <div class="nav-item">Neural Nets</div>
            </div>
        </div>
        
        <div class="center-content">
            <h1>Gagan Kesireddy</h1>
            <h2>Robotics M.Sc. & AI Engineer</h2>
            
            <a href="Resume_Gagan_Kesireddy.pdf" target="_blank" style="text-decoration: none;">
                <button class="btn-expedition">Deploy Profile</button>
            </a>
            
            <div class="drag-hint">[ CLICK TO DETONATE & DRAG TO ROTATE ]</div>
        </div>
        
        <div class="bottom-bar">
            <div>Cham, Bavaria</div>
            <div>STATUS: FIRE IN THE HOLE</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0F1923, 0.002); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.z = 400;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = true;
        controls.autoRotate = true; 
        controls.autoRotateSpeed = 2.0; 

        // Raze Particle System
        const particlesCount = 6000;
        const posArray = new Float32Array(particlesCount * 3);
        const colorsArray = new Float32Array(particlesCount * 3);

        const colorValRed = new THREE.Color(0xFF4655); 
        const colorOrange = new THREE.Color(0xFF8C00);
        const colorPink = new THREE.Color(0xFF007F);

        for(let i = 0; i < particlesCount * 3; i+=3) {
            const radius = 600 * Math.random();
            const theta = 2 * Math.PI * Math.random();
            const phi = Math.acos(2 * Math.random() - 1);

            posArray[i] = radius * Math.sin(phi) * Math.cos(theta);
            posArray[i+1] = radius * Math.sin(phi) * Math.sin(theta);
            posArray[i+2] = radius * Math.cos(phi);

            const randColor = Math.random();
            let c = colorValRed;
            if (randColor > 0.6) c = colorOrange;
            if (randColor > 0.85) c = colorPink;

            colorsArray[i] = c.r;
            colorsArray[i+1] = c.g;
            colorsArray[i+2] = c.b;
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colorsArray, 3));

        const material = new THREE.PointsMaterial({
            size: 3.5,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.9
        });

        const particlesMesh = new THREE.Points(geometry, material);
        scene.add(particlesMesh);

        // Satchel Detonation Logic
        let blastScale = 1.0;
        let isBlasting = false;

        window.addEventListener('mousedown', () => {
            isBlasting = true;
            blastScale = 2.5; // The explosion expansion factor
            controls.autoRotateSpeed = 15.0; // Spin violently
        });

        window.addEventListener('mouseup', () => {
            isBlasting = false;
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            // Recoil mechanics (Spring back to normal)
            if (!isBlasting && blastScale > 1.0) {
                blastScale -= 0.05;
                if (blastScale < 1.0) blastScale = 1.0;
            }
            if (!isBlasting && controls.autoRotateSpeed > 2.0) {
                controls.autoRotateSpeed -= 0.2;
            }

            particlesMesh.scale.set(blastScale, blastScale, blastScale);

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
