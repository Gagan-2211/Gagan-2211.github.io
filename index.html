<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gagan Kesireddy | AI & Robotics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030508; /* Deep space dark */
            font-family: 'Inter', sans-serif;
        }

        /* 3D Canvas Layer */
        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: grab;
        }
        #webgl-container:active {
            cursor: grabbing;
        }

        /* Minimalist UI Overlay (Like Deekshitth's) */
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none; /* Lets mouse clicks pass through to the 3D scene */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2.5rem 4rem;
            box-sizing: border-box;
            color: #ffffff;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-weight: 600;
            letter-spacing: 2px;
            font-size: 1rem;
            text-transform: uppercase;
        }
        .nav {
            display: flex;
            gap: 3rem;
        }
        .nav-item {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 300;
            cursor: pointer;
            pointer-events: auto;
            transition: opacity 0.3s;
        }
        .nav-item:hover {
            opacity: 0.6;
        }

        /* Center Content */
        .center-content {
            text-align: center;
            pointer-events: auto;
        }
        .center-content h1 {
            font-size: 6rem;
            font-weight: 200;
            margin: 0;
            letter-spacing: -3px;
        }
        .center-content h2 {
            font-size: 1.2rem;
            font-weight: 300;
            color: #a0aec0;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        .btn-expedition {
            margin-top: 40px;
            padding: 15px 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            border-radius: 50px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.4s ease;
            backdrop-filter: blur(5px);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Inter', sans-serif;
        }
        .btn-expedition:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
            transform: scale(1.05);
        }

        .drag-hint {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 20px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* Bottom Bar */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        @media (max-width: 768px) {
            .center-content h1 { font-size: 3.5rem; }
            .ui-overlay { padding: 1.5rem; }
            .nav { display: none; }
        }
    </style>
</head>
<body>

    <!-- 3D Canvas -->
    <div id="webgl-container"></div>
    
    <!-- Floating Minimalist UI -->
    <div class="ui-overlay">
        <div class="header">
            <div class="logo">Gagan Kesireddy</div>
            <div class="nav">
                <div class="nav-item">Trajectory</div>
                <div class="nav-item">Kinematics</div>
                <div class="nav-item">Neural Core</div>
            </div>
        </div>
        
        <div class="center-content">
            <h1>Deekshitth</h1> <!-- Wait, updating to your name! -->
            <h1 style="font-size: 5rem;">Gagan Kesireddy</h1>
            <h2>Robotics M.Sc. & AI Engineer</h2>
            
            <a href="Resume_Gagan_Kesireddy.pdf" target="_blank" style="text-decoration: none;">
                <button class="btn-expedition">Initialize Profile</button>
            </a>
            
            <div class="drag-hint">Drag to explore the environment</div>
        </div>
        
        <div class="bottom-bar">
            <div>Cham, Bavaria</div>
            <div>ROS 2 Node: Active</div>
        </div>
    </div>

    <!-- Three.js Library & Controls (Required for 3D) -->
