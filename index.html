    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0F1923, 0.002); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.z = 400;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = true;
        controls.autoRotate = true; 
        controls.autoRotateSpeed = 2.0; 

        // Raze Particle System
        const particlesCount = 6000;
        const posArray = new Float32Array(particlesCount * 3);
        const colorsArray = new Float32Array(particlesCount * 3);

        const colorValRed = new THREE.Color(0xFF4655); 
        const colorOrange = new THREE.Color(0xFF8C00);
        const colorPink = new THREE.Color(0xFF007F);

        for(let i = 0; i < particlesCount * 3; i+=3) {
            const radius = 600 * Math.random();
            const theta = 2 * Math.PI * Math.random();
            const phi = Math.acos(2 * Math.random() - 1);

            posArray[i] = radius * Math.sin(phi) * Math.cos(theta);
            posArray[i+1] = radius * Math.sin(phi) * Math.sin(theta);
            posArray[i+2] = radius * Math.cos(phi);

            const randColor = Math.random();
            let c = colorValRed;
            if (randColor > 0.6) c = colorOrange;
            if (randColor > 0.85) c = colorPink;

            colorsArray[i] = c.r;
            colorsArray[i+1] = c.g;
            colorsArray[i+2] = c.b;
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colorsArray, 3));

        const material = new THREE.PointsMaterial({
            size: 3.5,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.9
        });

        const particlesMesh = new THREE.Points(geometry, material);
        scene.add(particlesMesh);

        // Satchel Detonation Logic
        let blastScale = 1.0;
        let isBlasting = false;

        window.addEventListener('mousedown', () => {
            isBlasting = true;
            blastScale = 2.5; 
            controls.autoRotateSpeed = 15.0; 
        });

        window.addEventListener('mouseup', () => {
            isBlasting = false;
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            if (!isBlasting && blastScale > 1.0) {
                blastScale -= 0.05;
                if (blastScale < 1.0) blastScale = 1.0;
            }
            if (!isBlasting && controls.autoRotateSpeed > 2.0) {
                controls.autoRotateSpeed -= 0.2;
            }

            particlesMesh.scale.set(blastScale, blastScale, blastScale);

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
