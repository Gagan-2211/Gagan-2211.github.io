<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gagan Kesireddy | KGC.LAB</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-carbon: #06080C;
            --petronas-cyan: #00A19B;
            --raze-red: #FF4655;
            --silver: #E2E8F0;
            --font-head: 'Rajdhani', sans-serif;
            --font-tech: 'Fira Code', monospace;
            --font-body: 'Inter', sans-serif;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-carbon); overflow: hidden;
            font-family: var(--font-body);
        }

        /* 3D Canvas */
        #webgl-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; outline: none; }

        /* UI Overlays */
        .hud-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
            padding: 2.5rem; box-sizing: border-box;
        }

        .top-bar { display: flex; justify-content: space-between; align-items: flex-start; }
        
        .logo { font-family: var(--font-tech); font-size: 2rem; font-weight: 700; color: var(--raze-red); text-shadow: 0 0 15px rgba(255, 70, 85, 0.4); pointer-events: auto; cursor: pointer; }
        
        .telemetry { font-family: var(--font-tech); font-size: 0.8rem; color: #8B978F; text-align: right; line-height: 1.5; }
        .telemetry span { color: var(--petronas-cyan); }

        .controls-hint { text-align: center; font-family: var(--font-tech); color: #fff; font-size: 0.9rem; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 10px #000; }
        .controls-hint span { color: var(--raze-red); }

        /* The Assemble Button */
        #assemble-btn {
            pointer-events: auto; margin: 0 auto; display: block;
            background: rgba(255, 70, 85, 0.1); border: 2px solid var(--raze-red); color: var(--raze-red);
            padding: 1rem 3rem; font-family: var(--font-tech); font-size: 1.2rem; font-weight: 700;
            text-transform: uppercase; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 70, 85, 0.2); clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
        }
        #assemble-btn:hover { background: var(--raze-red); color: #fff; }
        #assemble-btn.active { background: var(--petronas-cyan); border-color: var(--petronas-cyan); color: #000; box-shadow: 0 0 30px rgba(0, 161, 155, 0.5); }

        /* Project Data Modal */
        #project-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.95);
            width: 80%; max-width: 800px; background: rgba(10, 13, 20, 0.95);
            border: 1px solid var(--petronas-cyan); padding: 3rem; z-index: 20;
            box-shadow: 0 0 50px rgba(0, 161, 155, 0.2); backdrop-filter: blur(10px);
            opacity: 0; pointer-events: none; transition: all 0.4s ease;
        }
        #project-modal.visible { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }

        .modal-category { font-family: var(--font-tech); color: var(--petronas-cyan); font-size: 0.9rem; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 2px; }
        .modal-title { font-family: var(--font-head); font-size: 4rem; color: #fff; line-height: 1; margin-bottom: 1rem; text-transform: uppercase; }
        .modal-desc { font-family: var(--font-body); font-size: 1.1rem; color: var(--silver); margin-bottom: 2rem; line-height: 1.6; }
        .modal-tech { font-family: var(--font-tech); font-size: 0.9rem; color: #8B978F; margin-bottom: 2rem; padding: 1rem; background: rgba(255,255,255,0.02); border-left: 2px solid var(--petronas-cyan); }
        
        .modal-btn {
            display: inline-block; padding: 1rem 2rem; background: var(--petronas-cyan); color: #000;
            font-family: var(--font-tech); font-weight: 700; text-decoration: none; text-transform: uppercase; transition: 0.2s;
        }
        .modal-btn:hover { background: #fff; }
        
        #close-modal {
            position: absolute; top: 1.5rem; right: 1.5rem; background: transparent; border: none;
            color: #fff; font-size: 1.5rem; cursor: pointer; font-family: var(--font-tech);
        }
        #close-modal:hover { color: var(--raze-red); }

        /* Crosshair */
        .crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: rgba(255,255,255,0.5); border-radius: 50%; transform: translate(-50%, -50%); z-index: 5; pointer-events: none; }
    </style>
</head>
<body>

    <div id="webgl-container" tabindex="0"></div>
    <div class="crosshair"></div>

    <div class="hud-layer">
        <div class="top-bar">
            <div class="logo">&lt;KGC.LAB/&gt;</div>
            <div class="telemetry">
                ENGINE: <span>INSTANCED MESH v3</span><br>
                UNITS: <span id="unit-count">3,000</span><br>
                STATUS: <span id="status-text" style="color:var(--raze-red);">ROAMING</span>
            </div>
        </div>
        
        <div class="controls-hint" id="hint-text">
            <span>[ CLICK BUTTON TO ASSEMBLE TITAN ]</span>
        </div>

        <button id="assemble-btn">ACTIVATE TITAN</button>
    </div>

    <!-- The Project Modal -->
    <div id="project-modal">
        <button id="close-modal">X</button>
        <div class="modal-category" id="m-category">SYSTEM.NODE</div>
        <div class="modal-title" id="m-title">PROJECT NAME</div>
        <div class="modal-tech" id="m-tech">TECH STACK HERE</div>
        <div class="modal-desc" id="m-desc">Project description goes here. Detailed metrics and kinematics data.</div>
        <a href="#" class="modal-btn">ACCESS REPOSITORY</a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Project Data Payload
        const projects = {
            ur5e: { cat: "KINEMATICS", title: "6-DoF UR5e Manipulator", tech: "ROS 2 | MoveIt | Gazebo | TF2", desc: "Engineered a custom IK solver and mapped the full TF2 frame tree. Achieved 100% success rate in autonomous peg-in-hole assembly by resolving delayed target calibration." },
            slam: { cat: "PERCEPTION", title: "SLAM & Navigation", tech: "YOLO | OpenCV | Nav2 | Lidar", desc: "Integrated real-time YOLO bounding box perception with autonomous mapping protocols. Synchronized raw camera feeds with LIDAR point clouds for dynamic environment navigation." },
            motion: { cat: "NEURAL NETWORKS", title: "Motion Prediction", tech: "LSTM | 1D-CNN | inD Dataset | Python", desc: "Developed a hybrid deep learning model anticipating traffic participant trajectories. Minimized Average Displacement Error (ADE) to generate fan-out prediction visualizations." }
        };

        const container = document.getElementById('webgl-container');
        const assembleBtn = document.getElementById('assemble-btn');
        const statusText = document.getElementById('status-text');
        const hintText = document.getElementById('hint-text');
        const modal = document.getElementById('project-modal');
        const closeModal = document.getElementById('close-modal');

        // Scene Setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x06080C, 0.001);
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 5000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Lighting for the 3D Models
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0x00A19B, 1.5);
        dirLight.position.set(200, 500, 300);
        scene.add(dirLight);
        const redLight = new THREE.DirectionalLight(0xFF4655, 1);
        redLight.position.set(-200, 200, -300);
        scene.add(redLight);

        // The Grid Environment
        const grid = new THREE.GridHelper(4000, 80, 0x00A19B, 0x11151C);
        grid.position.y = 0;
        scene.add(grid);

        // Project Pads (Navigation Goals)
        const pads = [
            { id: 'ur5e', color: 0x00A19B, x: -600, z: -800 },
            { id: 'slam', color: 0xFFD700, x: 0, z: -1200 },
            { id: 'motion', color: 0xFF4655, x: 600, z: -800 }
        ];

        pads.forEach(pad => {
            const padGeo = new THREE.CylinderGeometry(80, 80, 5, 32);
            const padMat = new THREE.MeshStandardMaterial({ color: pad.color, emissive: pad.color, emissiveIntensity: 0.5 });
            const padMesh = new THREE.Mesh(padGeo, padMat);
            padMesh.position.set(pad.x, 2.5, pad.z);
            scene.add(padMesh);

            const ringGeo = new THREE.RingGeometry(90, 100, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: pad.color, side: THREE.DoubleSide });
            const ringMesh = new THREE.Mesh(ringGeo, ringMat);
            ringMesh.rotation.x = -Math.PI / 2;
            ringMesh.position.set(pad.x, 1, pad.z);
            scene.add(ringMesh);
            pad.ring = ringMesh;
        });

        // ==========================================
        // SWARM TO TITAN ENGINE (InstancedMesh)
        // ==========================================
        const botCount = 3000;
        // The Mini-Robot Geometry (A cylinder resembling a TurtleBot core)
        const botGeo = new THREE.CylinderGeometry(3, 3, 6, 8);
        const botMat = new THREE.MeshStandardMaterial({ color: 0xFF4655, metalness: 0.8, roughness: 0.2 });
        const instancedBots = new THREE.InstancedMesh(botGeo, botMat, botCount);
        
        const dummy = new THREE.Object3D();
        const swarmData = [];
        const titanData = [];

        // Generate Titan Formation & Initial Swarm Positions
        for(let i=0; i<botCount; i++) {
            // Swarm Logic
            swarmData.push({
                x: (Math.random() - 0.5) * 2000,
                y: 10 + Math.random() * 200,
                z: (Math.random() - 0.5) * 2000,
                vx: (Math.random() - 0.5) * 6,
                vy: (Math.random() - 0.5) * 2,
                vz: (Math.random() - 0.5) * 6
            });

            // Titan Anatomy Generation (Procedural Humanoid)
            let part = Math.random();
            let tx, ty, tz;
            if (part < 0.1) { // Head
                tx = (Math.random() - 0.5) * 40; ty = 220 + Math.random() * 40; tz = (Math.random() - 0.5) * 40;
            } else if (part < 0.45) { // Torso
                tx = (Math.random() - 0.5) * 100; ty = 80 + Math.random() * 140; tz = (Math.random() - 0.5) * 60;
            } else if (part < 0.6) { // L Arm
                tx = -80 - Math.random() * 30; ty = 80 + Math.random() * 120; tz = (Math.random() - 0.5) * 30;
            } else if (part < 0.75) { // R Arm
                tx = 80 + Math.random() * 30; ty = 80 + Math.random() * 120; tz = (Math.random() - 0.5) * 30;
            } else if (part < 0.875) { // L Leg
                tx = -40 + (Math.random() - 0.5) * 35; ty = 5 + Math.random() * 80; tz = (Math.random() - 0.5) * 35;
            } else { // R Leg
                tx = 40 + (Math.random() - 0.5) * 35; ty = 5 + Math.random() * 80; tz = (Math.random() - 0.5) * 35;
            }
            titanData.push({ x: tx, y: ty, z: tz });

            dummy.position.set(swarmData[i].x, swarmData[i].y, swarmData[i].z);
            dummy.updateMatrix();
            instancedBots.setMatrixAt(i, dummy.matrix);
        }
        scene.add(instancedBots);

        // State Machine
        let isTitan = false;
        let titanWorldPos = new THREE.Vector3(0, 0, 0); // Where the Titan is on the grid
        let activeModal = false;
        
        // WASD Controls
        const keys = { w: false, a: false, s: false, d: false };

        assembleBtn.addEventListener('click', () => {
            isTitan = !isTitan;
            container.focus();
            if(isTitan) {
                assembleBtn.innerText = "SCATTER PROTOCOL";
                assembleBtn.classList.add('active');
                statusText.innerText = "TITAN ONLINE";
                statusText.style.color = "var(--petronas-cyan)";
                hintText.innerHTML = "[ USE <span>W A S D</span> TO PILOT TITAN TO PROJECT PADS ]";
                botMat.color.setHex(0x00A19B); // Shift bots to Cyan
            } else {
                assembleBtn.innerText = "ACTIVATE TITAN";
                assembleBtn.classList.remove('active');
                statusText.innerText = "ROAMING";
                statusText.style.color = "var(--raze-red)";
                hintText.innerHTML = "<span>[ CLICK BUTTON TO ASSEMBLE TITAN ]</span>";
                botMat.color.setHex(0xFF4655); // Shift back to Red
                
                // Explosive scatter velocity
                for(let i=0; i<botCount; i++) {
                    swarmData[i].vx = (Math.random() - 0.5) * 40;
                    swarmData[i].vy = Math.random() * 20;
                    swarmData[i].vz = (Math.random() - 0.5) * 40;
                }
            }
        });

        // Close Modal
        closeModal.addEventListener('click', () => {
            modal.classList.remove('visible');
            activeModal = false;
            container.focus();
        });

        container.addEventListener('keydown', (e) => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; });
        container.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });

        // Animation Loop
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            let delta = clock.getDelta();

            // Animate Project Pads
            pads.forEach(p => { p.ring.rotation.z += 0.02; });

            if (isTitan && !activeModal) {
                // Move Titan Base Position
                let speed = 600 * delta;
                if (keys.w) titanWorldPos.z -= speed;
                if (keys.s) titanWorldPos.z += speed;
                if (keys.a) titanWorldPos.x -= speed;
                if (keys.d) titanWorldPos.x += speed;

                // Check Pad Collision
                pads.forEach(p => {
                    if (Math.hypot(titanWorldPos.x - p.x, titanWorldPos.z - p.z) < 80) {
                        // Trigger Modal
                        activeModal = true;
                        document.getElementById('m-category').innerText = projects[p.id].cat;
                        document.getElementById('m-title').innerHTML = projects[p.id].title;
                        document.getElementById('m-tech').innerText = projects[p.id].tech;
                        document.getElementById('m-desc').innerText = projects[p.id].desc;
                        modal.classList.add('visible');
                        
                        // Bounce Titan back slightly so it doesn't get stuck in the trigger
                        titanWorldPos.z += 100;
                    }
                });

                // Lerp Bots into Titan Shape
                for(let i=0; i<botCount; i++) {
                    swarmData[i].x += ((titanData[i].x + titanWorldPos.x) - swarmData[i].x) * 0.15;
                    swarmData[i].y += (titanData[i].y - swarmData[i].y) * 0.15;
                    swarmData[i].z += ((titanData[i].z + titanWorldPos.z) - swarmData[i].z) * 0.15;
                    
                    dummy.position.set(swarmData[i].x, swarmData[i].y, swarmData[i].z);
                    dummy.updateMatrix();
                    instancedBots.setMatrixAt(i, dummy.matrix);
                }

                // Third-Person Camera follow
                let targetCamX = titanWorldPos.x;
                let targetCamY = titanWorldPos.y + 300;
                let targetCamZ = titanWorldPos.z + 600;
                
                camera.position.x += (targetCamX - camera.position.x) * 0.05;
                camera.position.y += (targetCamY - camera.position.y) * 0.05;
                camera.position.z += (targetCamZ - camera.position.z) * 0.05;
                camera.lookAt(titanWorldPos.x, titanWorldPos.y + 100, titanWorldPos.z);

            } else if (!isTitan) {
                // Swarm Logic
                for(let i=0; i<botCount; i++) {
                    let b = swarmData[i];
                    b.x += b.vx; b.y += b.vy; b.z += b.vz;
                    
                    // Boundary bouncing
                    if(b.x > 1500 || b.x < -1500) b.vx *= -1;
                    if(b.y > 600) b.vy *= -1;
                    if(b.y < 10) { b.y = 10; b.vy *= -1; }
                    if(b.z > 1500 || b.z < -1500) b.vz *= -1;

                    // Friction and random drift
                    b.vx = b.vx * 0.98 + (Math.random() - 0.5) * 0.5;
                    b.vy = b.vy * 0.98 + (Math.random() - 0.5) * 0.5;
                    b.vz = b.vz * 0.98 + (Math.random() - 0.5) * 0.5;

                    dummy.position.set(b.x, b.y, b.z);
                    // Add some rotation to the bots as they fly
                    dummy.rotation.x += b.vx * 0.02;
                    dummy.rotation.y += b.vy * 0.02;
                    dummy.updateMatrix();
                    instancedBots.setMatrixAt(i, dummy.matrix);
                }

                // Idle Camera Sweep
                camera.position.x = Math.sin(Date.now() * 0.0002) * 1200;
                camera.position.z = Math.cos(Date.now() * 0.0002) * 1200;
                camera.position.y = 600;
                camera.lookAt(0, 0, 0);
            }

            instancedBots.instanceMatrix.needsUpdate = true;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
