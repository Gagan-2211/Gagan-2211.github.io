<!DOCTYPE html>
<html lang="en">

    <style>
        :root {
            --bg-deep: #050a15;
            --bg-hud: rgba(10, 20, 40, 0.6);
            --cyan: #00f0ff;
            --cyan-dim: rgba(0, 240, 255, 0.2);
            --magenta: #ff003c;
            --green: #39ff14;
            --text-main: #e0e7ff;
            --text-muted: #8b9bb4;
            --font-sans: 'Inter', sans-serif;
            --font-mono: 'Fira Code', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-sans);
            overflow-x: hidden;
        }

        /* LiDAR Background Canvas */
        #lidar-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            opacity: 0.6;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            border-bottom: 1px solid var(--cyan-dim);
            background: rgba(5, 10, 21, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--cyan);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--cyan);
        }

        .lang-toggle {
            background: transparent;
            border: 1px solid var(--cyan);
            color: var(--cyan);
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .lang-toggle:hover {
            background: var(--cyan-dim);
        }

        /* Hero Section */
        .hero {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 4rem 5%;
            position: relative;
        }

        .hero-availability {
            font-family: var(--font-mono);
            color: var(--green);
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            padding: 0.4rem 1rem;
            border: 1px solid rgba(57, 255, 20, 0.3);
            border-radius: 20px;
            background: rgba(57, 255, 20, 0.05);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px var(--green);
            animation: pulse 1.5s infinite;
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -1px;
        }

        .hero h2 {
            font-size: 1.5rem;
            color: var(--text-muted);
            font-weight: 400;
            max-width: 800px;
            margin-bottom: 2rem;
            line-height: 1.4;
        }

        .stats-strip {
            font-family: var(--font-mono);
            font-size: 1rem;
            color: var(--cyan);
            margin-bottom: 3rem;
            word-spacing: 5px;
        }

        .hero-buttons {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--cyan);
            color: var(--bg-deep);
            font-weight: 600;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .btn-primary:hover {
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--text-muted);
        }

        .btn-secondary:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            background: var(--cyan-dim);
            transform: translateY(-2px);
        }

        /* Animations */
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .hero h2 { font-size: 1.2rem; }
            .stats-strip { font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <canvas id="lidar-canvas"></canvas>

    <!-- Hero Section -->

    <script>
        // LiDAR Point Cloud Background
        const canvas = document.getElementById('lidar-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        for (let i = 0; i < 150; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.5,
                dx: (Math.random() - 0.5) * 0.5,
                dy: (Math.random() - 0.5) * 0.5
            });
        }

        function animateLiDAR() {
            requestAnimationFrame(animateLiDAR);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#00f0ff';
            particles.forEach(p => {
                p.x += p.dx;
                p.y += p.dy;
                
                if (p.x < 0 || p.x > canvas.width) p.dx = -p.dx;
                if (p.y < 0 || p.y > canvas.height) p.dy = -p.dy;
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });
        }
        animateLiDAR();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
